name: Build Ren'Py Web

on:
  push:
    branches: [main]
    paths:
      - 'renpy-project/**'
      - '.github/workflows/renpy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renpy-web-main
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl unzip bzip2 imagemagick file

      - name: Download Ren'Py 8.5.3
        run: |
          curl -fL --retry 3 -o renpy-sdk.tar.bz2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          tar -xjf renpy-sdk.tar.bz2
          curl -fL --retry 3 -o renpy-web.zip https://www.renpy.org/dl/8.5.3/renpy-8.5.3-web.zip
          rm -rf web-support
          mkdir web-support
          unzip -q renpy-web.zip -d web-support
          if [ -d web-support/web ]; then
            rm -rf renpy-8.5.3-sdk/web renpy-8.5.3/web
            if [ -d renpy-8.5.3-sdk ]; then mv web-support/web renpy-8.5.3-sdk/web; else mv web-support/web renpy-8.5.3/web; fi
          elif [ -d web-support/renpy-8.5.3/web ]; then
            if [ -d renpy-8.5.3-sdk ]; then cp -a web-support/renpy-8.5.3/web renpy-8.5.3-sdk/web; else cp -a web-support/renpy-8.5.3/web renpy-8.5.3/web; fi
          fi
          RENPY_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'renpy-8.5.3*' | head -n 1)
          echo "RENPY_DIR=$RENPY_DIR" >> "$GITHUB_ENV"
          test -f "$RENPY_DIR/renpy.sh"
          test -d "$RENPY_DIR/web"

      - name: Normalize approved artwork for Ren'Py
        run: |
          set -euxo pipefail
          SRC="renpy-project/game/images/cg/key-art.webp"
          DST="renpy-project/game/images/cg/key-art.jpg"
          test -f "$SRC"
          MIME=$(file -b --mime-type "$SRC")
          echo "Detected key art MIME: $MIME"
          case "$MIME" in
            image/jpeg)
              cp "$SRC" "$DST"
              ;;
            image/png|image/webp)
              convert "$SRC" -quality 96 "$DST"
              ;;
            *)
              echo "Unsupported or corrupt key art: $MIME"
              exit 1
              ;;
          esac
          file "$DST"
          identify "$DST"

          # Las demás hojas/imagenes antiguas son material fuente y no deben ser
          # cargadas por Ren'Py en esta demo. Se eliminan solo en el runner.
          find renpy-project/game/images -type f \( -name '*.webp' -o -name '*.avif' \) -delete
          rm -f renpy-project/web-presplash.webp renpy-project/progressive_download.txt
          test -f "$DST"

      - name: Generate Ren'Py GUI
        run: |
          cd "$RENPY_DIR"
          ./renpy.sh launcher generate_gui "$GITHUB_WORKSPACE/renpy-project" --width 1600 --height 900 --accent '#d7a75f' --boring '#100b09' --language spanish

      - name: Lint Ren'Py project
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          cd "$RENPY_DIR"
          ./renpy.sh "$GITHUB_WORKSPACE/renpy-project" lint "$GITHUB_WORKSPACE/renpy-lint.txt" --error-code
          cat "$GITHUB_WORKSPACE/renpy-lint.txt"

      - name: Build Web distribution
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          rm -rf "$GITHUB_WORKSPACE/web-build"
          mkdir -p "$GITHUB_WORKSPACE/web-build"
          cd "$RENPY_DIR"
          ./renpy.sh launcher web_build "$GITHUB_WORKSPACE/renpy-project" --destination "$GITHUB_WORKSPACE/web-build"
          test -f "$GITHUB_WORKSPACE/web-build/index.html"

      - name: Publish Ren'Py build at GitHub Pages root
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"

          # Deshacemos únicamente cambios temporales usados para compilar.
          git restore renpy-project
          git clean -fd renpy-project

          # Conservamos una copia del build y lo publicamos también en la raíz,
          # que es la carpeta que GitHub Pages sirve actualmente.
          rm -rf web
          mkdir web
          cp -a web-build/. web/
          touch web/.nojekyll
          cp -a web-build/. ./
          touch .nojekyll

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'build: publicar RenPy 0.2.0 en GitHub Pages'
            git pull --rebase origin main
            git push origin main
          fi
